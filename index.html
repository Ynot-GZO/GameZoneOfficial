<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameZoneOfficial Save-Editors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #070b16;
      --bg1: #121830;
      --panel: rgba(14, 18, 36, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --text: #f4f7ff;
      --muted: #9aa8c7;
      --gold: #ffd700;
      --discord: #5865f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Rajdhani", "Segoe UI", sans-serif;
      color: var(--text);
      background-color: #060910;
      background-image:
        radial-gradient(ellipse 85% 55% at 50% -5%, rgba(255, 170, 60, 0.16), transparent 55%),
        radial-gradient(ellipse 50% 45% at 0% 100%, rgba(40, 120, 180, 0.14), transparent 55%),
        radial-gradient(ellipse 45% 40% at 100% 85%, rgba(180, 70, 40, 0.1), transparent 50%),
        linear-gradient(165deg, #10182c 0%, #070b16 42%, #05070e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 88px 20px 100px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 50% 40%, transparent 28%, rgba(0, 0, 0, 0.45) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, transparent 30%, transparent 70%, rgba(0, 0, 0, 0.35) 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      background-image:
        linear-gradient(rgba(255, 215, 120, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 215, 120, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      animation: bg-drift 28s ease-in-out infinite alternate;
    }

    @keyframes bg-drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-12px, 8px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after,
      .bg-fx span { animation: none !important; }
    }

    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-fx span {
      position: absolute;
      display: block;
      border-radius: 50%;
      will-change: transform, opacity;
    }

    .bg-fx .orb {
      filter: blur(2px);
      opacity: 0.55;
      background: radial-gradient(circle at 30% 30%, rgba(255, 220, 140, 0.55), rgba(255, 140, 40, 0.12) 55%, transparent 70%);
      animation: orb-float linear infinite;
    }

    .bg-fx .orb:nth-child(1) {
      width: 180px; height: 180px; left: 8%; top: 18%;
      animation-duration: 22s; animation-delay: -2s;
    }
    .bg-fx .orb:nth-child(2) {
      width: 120px; height: 120px; right: 10%; top: 28%;
      background: radial-gradient(circle at 30% 30%, rgba(120, 190, 255, 0.4), rgba(40, 100, 180, 0.1) 55%, transparent 70%);
      animation-duration: 18s; animation-delay: -6s;
    }
    .bg-fx .orb:nth-child(3) {
      width: 220px; height: 220px; left: 55%; bottom: 8%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 100, 70, 0.28), rgba(120, 40, 20, 0.08) 55%, transparent 70%);
      animation-duration: 26s; animation-delay: -10s;
    }

    .bg-fx .spark {
      width: 5px; height: 5px;
      background: #ffd78a;
      box-shadow: 0 0 10px rgba(255, 200, 100, 0.8);
      opacity: 0.7;
      animation: spark-rise linear infinite;
    }

    .bg-fx .spark:nth-child(4) { left: 15%; bottom: -10%; animation-duration: 14s; animation-delay: 0s; }
    .bg-fx .spark:nth-child(5) { left: 28%; bottom: -10%; width: 3px; height: 3px; animation-duration: 11s; animation-delay: -3s; }
    .bg-fx .spark:nth-child(6) { left: 42%; bottom: -10%; animation-duration: 16s; animation-delay: -7s; }
    .bg-fx .spark:nth-child(7) { left: 58%; bottom: -10%; width: 4px; height: 4px; animation-duration: 12s; animation-delay: -1s; }
    .bg-fx .spark:nth-child(8) { left: 72%; bottom: -10%; animation-duration: 15s; animation-delay: -5s; }
    .bg-fx .spark:nth-child(9) { left: 86%; bottom: -10%; width: 3px; height: 3px; animation-duration: 13s; animation-delay: -9s; }

    .bg-fx .streak {
      width: 2px;
      height: 70px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(255, 210, 120, 0.55), transparent);
      opacity: 0.35;
      animation: streak-fall linear infinite;
    }

    .bg-fx .streak:nth-child(10) { left: 20%; top: -20%; animation-duration: 9s; animation-delay: -2s; }
    .bg-fx .streak:nth-child(11) { left: 48%; top: -20%; height: 100px; animation-duration: 12s; animation-delay: -5s; }
    .bg-fx .streak:nth-child(12) { left: 78%; top: -20%; height: 60px; animation-duration: 8s; animation-delay: -1s; }

    @keyframes orb-float {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      33%  { transform: translate3d(30px, -24px, 0) scale(1.05); }
      66%  { transform: translate3d(-22px, 18px, 0) scale(0.96); }
      100% { transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes spark-rise {
      0%   { transform: translate3d(0, 0, 0); opacity: 0; }
      15%  { opacity: 0.85; }
      100% { transform: translate3d(18px, -110vh, 0); opacity: 0; }
    }

    @keyframes streak-fall {
      0%   { transform: translate3d(0, 0, 0) rotate(12deg); opacity: 0; }
      12%  { opacity: 0.4; }
      100% { transform: translate3d(-24px, 120vh, 0) rotate(12deg); opacity: 0; }
    }

    .brand {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2rem, 6vw, 3.1rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff6b6b 0%, #ffa500 45%, #ffd700 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .credits-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 14px 22px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(80, 60, 140, 0.4);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .credits-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(100, 80, 180, 0.5);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
    }

    .hud-shell {
      width: 100%;
      max-width: 920px;
      position: relative;
      z-index: 1;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .hud-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 96px;
      padding: 0;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(15, 20, 40, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55), 0 0 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, filter 0.2s ease;
    }

    .hud-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      filter: brightness(1.06);
    }

    .hud-btn:active { transform: translateY(0); }

    .hud-btn__label {
      position: relative;
      z-index: 1;
      padding: 14px 16px;
      width: 100%;
    }

    .hud-btn--pal {
      border-color: rgba(255, 160, 90, 0.7);
      background:
        linear-gradient(180deg, rgba(90, 50, 20, 0.4) 0%, rgba(0, 0, 0, 0.58) 100%),
        radial-gradient(circle at 62% 38%, rgba(255, 180, 90, 0.32), transparent 48%),
        #1a1410;
    }

    .hud-btn--rsdw {
      border-color: rgba(232, 185, 35, 0.75);
      background:
        linear-gradient(180deg, rgba(74, 46, 20, 0.55) 0%, rgba(18, 14, 11, 0.85) 100%),
        radial-gradient(circle at 30% 20%, rgba(240, 196, 58, 0.28), transparent 45%),
        #1a1410;
    }

    .discord-strip {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .discord-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(88, 101, 242, 0.55);
      background: rgba(88, 101, 242, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .discord-link:hover {
      transform: translateY(-2px);
      border-color: rgba(142, 154, 255, 0.9);
      background: rgba(88, 101, 242, 0.45);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .discord-link svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: linear-gradient(135deg, rgba(30, 30, 50, 0.97), rgba(20, 20, 40, 0.99));
      border-radius: 15px;
      padding: 28px 30px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
    }

    .modal-title {
      font-family: "Orbitron", sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #ff6b6b 0%, #ffa500 50%, #ffd700 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-close {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .credits-section { margin-bottom: 22px; }

    .credits-category {
      font-size: 1.05rem;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }

    .credits-item {
      color: #fff;
      font-size: 1.05rem;
      line-height: 1.75;
      padding-left: 12px;
      margin-bottom: 6px;
    }

    .credits-item a {
      color: #8ad5ff;
      text-decoration: none;
    }

    .credits-item a:hover {
      color: #66c5ff;
      text-decoration: underline;
    }

    .credits-item strong { color: #fff; }

    .footer-note {
      position: relative;
      z-index: 1;
      margin-top: 1.75rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .footer-note strong { color: var(--gold); }

    @media (max-width: 640px) {
      body { padding: 72px 14px 80px; }
      .hud-grid { grid-template-columns: 1fr; }
      .credits-button {
        top: 12px;
        right: 12px;
        padding: 10px 14px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <span class="orb"></span>
    <span class="orb"></span>
    <span class="orb"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="streak"></span>
    <span class="streak"></span>
    <span class="streak"></span>
  </div>

  <button type="button" class="credits-button" id="creditsBtn">Credits</button>

  <header class="brand">
    <h1>GameZoneOfficial</h1>
    <p>Save-Editors</p>
  </header>

  <div class="hud-shell">
    <nav class="hud-grid" aria-label="Editors">
      <a class="hud-btn hud-btn--pal" href="editor.html">
        <span class="hud-btn__label">Palworld</span>
      </a>
      <a class="hud-btn hud-btn--rsdw" href="rsdw-editor.html">
        <span class="hud-btn__label">RS Dragonwilds</span>
      </a>
    </nav>

    <div class="discord-strip">
      <a
        class="discord-link"
        href="https://discord.gg/4hGKAHdvp6"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Discord — GameZoneOfficial
      </a>
    </div>
  </div>

  <p class="footer-note">Created by <strong>Ynot</strong></p>

  <div class="modal-overlay" id="creditsModal" role="dialog" aria-modal="true" aria-labelledby="creditsTitle">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="creditsTitle">Credits</div>
        <button type="button" class="modal-close" id="creditsClose" aria-label="Close">&times;</button>
      </div>
      <div class="credits-section">
        <div class="credits-item"><strong>Creator of website:</strong> Ynot</div>
        <div class="credits-item"><strong>Hosted on:</strong> GitHub Pages</div>
        <div class="credits-item">
          <strong>Partner / Close Friend:</strong>
          <a href="https://ggmodding.github.io/ggdropmansmoddingtools/" target="_blank" rel="noopener noreferrer">GGdropman</a>
        </div>
        <div class="credits-item">
          <strong>Biggest Support:</strong>
          <a href="https://discord.gg/4hGKAHdvp6" target="_blank" rel="noopener noreferrer">GZO</a>
        </div>
      </div>
      <div class="credits-section">
        <div class="credits-category">Editors</div>
        <div class="credits-item">
          <strong>Palworld · RS Dragonwilds:</strong> Ynot
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var modal = document.getElementById("creditsModal");
      var openBtn = document.getElementById("creditsBtn");
      var closeBtn = document.getElementById("creditsClose");

      function openCredits() { modal.classList.add("active"); }
      function closeCredits() { modal.classList.remove("active"); }

      openBtn.addEventListener("click", openCredits);
      closeBtn.addEventListener("click", closeCredits);
      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeCredits();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeCredits();
      });
    })();
  </script>
</body>
</html>
